<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ZX GPU</title>
<style>
  :root { color-scheme: dark; --bar: 44px; }
  html, body { margin: 0; height: 100%; background: #000; color: #ddd; font: 14px/1.3 system-ui, sans-serif; overflow: hidden; }
  #bar { position: fixed; inset: 0 0 auto 0; height: var(--bar); display: flex; align-items: center; gap: 14px; padding: 0 14px; background: #111; border-bottom: 1px solid #222; }
  #bar b { letter-spacing: .06em; }
  #bar select { background: #1c1c1c; color: #eee; border: 1px solid #333; border-radius: 4px; padding: 4px 6px; max-width: 46vw; }
  #bar a { color: #9cf; }
  #fps { margin-left: auto; color: #8a8; font-variant-numeric: tabular-nums; }
  #status { color: #f88; }
  #screen { position: fixed; inset: var(--bar) 0 0 0; width: 100%; height: calc(100% - var(--bar)); display: block; touch-action: none; outline: none; }
  #pad { position: fixed; left: 0; right: 0; bottom: 0; display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; padding: 6px; }
  #pad:empty { display: none; }
  #pad button { min-width: 56px; min-height: 48px; font: 600 14px system-ui; color: #fff; background: #222; border: 1px solid #444; border-radius: 8px; }
  body:has(#pad:not(:empty)) #screen { height: calc(100% - var(--bar) - 64px); }
  #start, #full { display: none; }
  body.play #bar { display: none; }
  body.play #screen { inset: 0; height: 100%; }
  body.play:has(#pad:not(:empty)) #screen { height: calc(100% - 64px); }
  body.play:not(.started) #start { display: flex; position: fixed; inset: 0; align-items: center; justify-content: center; background: rgba(0,0,0,.35); cursor: pointer; z-index: 5; }
  #start span { font: 600 18px system-ui; color: #fff; background: rgba(0,0,0,.6); border: 1px solid rgba(255,255,255,.35); border-radius: 999px; padding: 12px 22px; }
  body.play #full { display: block; position: fixed; top: 10px; right: 10px; z-index: 6; width: 36px; height: 36px; font-size: 20px; color: #fff; background: rgba(0,0,0,.45); border: 1px solid rgba(255,255,255,.25); border-radius: 6px; opacity: .35; cursor: pointer; }
  body.play #full:hover { opacity: 1; }
</style>
</head>
<body>
<div id="bar"><b>ZX GPU</b><select id="examples" aria-label="program"></select><span id="status"></span><a href="../SPEC.md">language spec</a><a href="../">ZX Flash</a><span id="fps"></span></div>
<canvas id="screen" tabindex="0"></canvas>
<div id="pad"></div>
<div id="start" role="button" aria-label="click to play"><span>&#9654;&#xFE0E; click to play</span></div>
<button id="full" title="full screen" aria-label="full screen">&#x26F6;&#xFE0E;</button>
<script type="module" src="host.js"></script>
</body>
</html>
